<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background with Rounded Square -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7931e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a8e8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded Square Background -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#gradient1)"/>

  <!-- ET Text in Black -->
  <text x="256" y="350" font-family="Arial, sans-serif" font-size="240" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="-15">ET</text>
</svg>
